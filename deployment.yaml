apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-sentiment-deployment
  labels:
    app: nlp-sentiment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nlp-sentiment
  template:
    metadata:
      labels:
        app: nlp-sentiment
    spec:
      containers:
      - name: sentiment-container
        image: nlp-sentiment-service:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: nlp-sentiment-service
spec:
  type: NodePort
  selector:
    app: nlp-sentiment
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30100